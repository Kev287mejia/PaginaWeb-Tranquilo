<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagina no encontrada | Tranquilo Lounge and Dinner</title>
    <meta name="robots" content="noindex, nofollow">

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="assets/images/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon-32.png">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Main stylesheet -->
    <link rel="stylesheet" href="assets/css/styles.css">

    <style>
        .error-page {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
            background-color: var(--color-bg-dark);
            position: relative;
            overflow: hidden;
        }
        .error-page::before {
            content: "404";
            position: absolute;
            font-size: clamp(12rem, 40vw, 28rem);
            font-family: var(--font-heading-blk);
            color: rgba(197, 168, 128, 0.04);
            letter-spacing: -1rem;
            user-select: none;
            pointer-events: none;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            white-space: nowrap;
        }
        .error-logo {
            width: clamp(80px, 15vw, 140px);
            margin-bottom: 2rem;
            opacity: 0.9;
        }
        .error-code {
            font-family: var(--font-heading-blk);
            font-size: clamp(1rem, 2vw, 1.2rem);
            letter-spacing: 0.6rem;
            color: var(--color-gold);
            text-transform: uppercase;
            margin-bottom: 1rem;
        }
        .error-title {
            font-family: var(--font-heading-med);
            font-size: clamp(2rem, 5vw, 3.5rem);
            color: var(--color-cream);
            margin-bottom: 1.2rem;
            font-weight: 300;
            line-height: 1.2;
        }
        .error-text {
            color: var(--color-cream-dim);
            font-size: 0.95rem;
            max-width: 420px;
            line-height: 1.8;
            margin-bottom: 2.5rem;
            letter-spacing: 0.3px;
        }
        .error-divider {
            width: 60px;
            height: 1px;
            background: var(--color-gold);
            margin: 1.5rem auto;
            opacity: 0.5;
        }
        .error-actions {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            justify-content: center;
        }
    </style>
</head>
<body class="error-template">

    <div class="error-page">
        <img src="assets/images/logo_white.png" alt="Tranquilo Lounge and Dinner" class="error-logo">
        <p class="error-code">Error 404</p>
        <h1 class="error-title">Mesa no encontrada</h1>
        <div class="error-divider"></div>
        <p class="error-text">Parece que esta pagina no existe o fue movida. No te preocupes, nuestra mesa siempre tiene un lugar para ti.</p>
        <div class="error-actions">
            <a href="index.html" class="btn">Volver al Inicio</a>
            <a href="menu.html" class="btn btn-outline">Ver el Menu</a>
        </div>
    </div>

</body>
</html>
